[package]
name = "rusted-light"
version = "0.1.0"
edition = "2021"
description = "Spotlight-style app launcher for Linux (X11/Wayland), written in Rust + GTK4."
license = "MIT"

[[bin]]
name = "rusted-light"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", package = "gtk4" }
dirs = "5"
evalexpr = "12"
nucleo-matcher = "0.3"
ignore = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
